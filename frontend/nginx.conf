server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's shell files keep stable names between releases. Never let the
    # browser reuse an old bootstrap or compiled application after a deploy.
    location ~ ^/(?:index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|main\.dart\.js|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        try_files /favicon.png =404;
    }
}
