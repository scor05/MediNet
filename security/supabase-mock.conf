server {
    listen 8080;
    server_name _;

    default_type application/json;

    location = /health {
        return 200 '{"status":"ok"}';
    }

    location = /auth/v1/user {
        if ($http_authorization = "Bearer system-active-token") {
            return 200 '{"id":"11111111-1111-4111-8111-111111111111","email":"active.system@example.test"}';
        }

        if ($http_authorization = "Bearer system-inactive-token") {
            return 200 '{"id":"33333333-3333-4333-8333-333333333333","email":"inactive.system@example.test"}';
        }

        if ($http_authorization = "Bearer system-unknown-token") {
            return 200 '{"id":"44444444-4444-4444-8444-444444444444","email":"same-email.system@example.test"}';
        }

        return 401 '{"message":"Invalid integration token"}';
    }

    location / {
        return 404 '{"message":"Not found"}';
    }
}
