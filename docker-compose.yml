services:
  backend:
    build: ./backend
    image: medinet-backend:latest
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  reverb:
    image: medinet-backend:latest
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    expose:
      - "8080"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  queue:
    image: medinet-backend:latest
    command:
      - php
      - artisan
      - queue:work
      - --queue=default
      - --sleep=1
      - --tries=3
      - --timeout=60
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      reverb:
        condition: service_healthy

  frontend:
    build: ./frontend
    expose:
      - "80"
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medinet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    name: medinet_postgres_data
