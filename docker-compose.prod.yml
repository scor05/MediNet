services:
  backend:
    image: medinet-backend:latest
    container_name: medinet_backend
    expose:
      - "8000"
    volumes:
      - ./backend/laravel:/app
      - vendor_data:/app/vendor
    env_file:
      - ./backend/.env
    tty: true
    stdin_open: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: medinet_frontend
    expose:
      - "80"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: medinet_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  vendor_data:
  caddy_data:
  caddy_config:
