services:
  backend:
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      SUPABASE_URL: http://supabase-mock:8080
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      supabase-mock:
        condition: service_healthy

  reverb:
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

  supabase-mock:
    image: nginx:alpine
    volumes:
      - ./security/supabase-mock.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: "no"

  security-proxy:
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      reverb:
        condition: service_healthy
    restart: "no"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    volumes:
      - ./zap-reports:/zap/wrk:rw
    depends_on:
      security-proxy:
        condition: service_started
    profiles:
      - security-tools

volumes:
  postgres_data:
    name: medinet_security_postgres_data
