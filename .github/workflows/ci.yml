name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (Laravel + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: medinet_test
          POSTGRES_USER: medinet
          POSTGRES_PASSWORD: medinet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medinet -d medinet_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend/laravel

    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: medinet_test
      DB_USERNAME: medinet
      DB_PASSWORD: medinet_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_pgsql
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar carpeta de resultados
        run: mkdir -p storage/test-results

      - name: Ejecutar migraciones
        run: php artisan migrate:fresh --force

      - name: Ejecutar pruebas unitarias y funcionales
        run: php artisan test --log-junit storage/test-results/phpunit.xml

      - name: Guardar reporte del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-backend-${{ github.run_number }}
          path: backend/laravel/storage/test-results/phpunit.xml
          if-no-files-found: warn
          retention-days: 30

  system-tests:
    name: Integración y regresión (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar variables temporales
        run: cp .github/ci/backend.env backend/.env

      - name: Construir e iniciar los servicios
        run: >-
          docker compose --env-file backend/.env
          up -d --build --wait --wait-timeout 120
          db backend reverb frontend

      - name: Preparar la base de datos
        run: >-
          docker compose --env-file backend/.env exec -T backend
          php artisan migrate:fresh --force

      - name: Preparar carpeta de resultados
        run: mkdir -p backend/laravel/storage/test-results

      - name: Ejecutar pruebas de integración y regresión
        run: >-
          docker compose --env-file backend/.env exec -T backend
          php vendor/bin/pest --configuration=phpunit.system.xml
          --log-junit=storage/test-results/system-tests.xml

      - name: Guardar reporte de integración y regresión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-integracion-regresion-${{ github.run_number }}
          path: backend/laravel/storage/test-results/system-tests.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Mostrar logs de contenedores si hubo un fallo
        if: failure()
        run: docker compose --env-file backend/.env logs --no-color

      - name: Detener los servicios
        if: always()
        run: docker compose --env-file backend/.env down --volumes

  frontend-tests:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          dart --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Preparar carpeta de resultados
        run: mkdir -p build/test-results

      - name: Ejecutar pruebas de integración y regresión
        shell: bash
        run: |
          set -o pipefail
          flutter test --machine 2>&1 | tee build/test-results/flutter-test.json

      - name: Verificar build web
        run: flutter build web --release

      - name: Guardar reporte del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-frontend-${{ github.run_number }}
          path: frontend/build/test-results/flutter-test.json
          if-no-files-found: warn
          retention-days: 30
